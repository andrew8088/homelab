apiVersion: apps/v1
kind: Deployment
metadata:
  name: lira
  namespace: lira
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lira
  template:
    metadata:
      labels:
        app: lira
    spec:
      containers:
      - name: lira
        image: lira:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: LIRA_DB_DIR
          value: /data
        volumeMounts:
        - name: app-data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: app-data
        hostPath:
          path: /mnt/primary/k3s-storage/lira-data
          type: DirectoryOrCreate
