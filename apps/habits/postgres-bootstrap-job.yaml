apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap
  namespace: habits
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: postgres-bootstrap
    spec:
      restartPolicy: OnFailure
      initContainers:
      - name: wait-for-postgres
        image: postgres:16
        command: ['sh', '-c']
        args:
        - |
          until pg_isready -h postgres -p 5432 -U postgres; do
            echo "Waiting for postgres..."
            sleep 2
          done
        env:
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: habits-secrets
              key: POSTGRES_PASSWORD
      containers:
      - name: bootstrap
        image: postgres:16
        env:
        - name: PGHOST
          value: postgres
        - name: PGUSER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: habits-secrets
              key: POSTGRES_PASSWORD
        - name: HABITS_OWNER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: habits-secrets
              key: HABITS_OWNER_PASSWORD
        - name: HABITS_RW_PASSWORD
          valueFrom:
            secretKeyRef:
              name: habits-secrets
              key: HABITS_RW_PASSWORD
        - name: HABITS_RO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: habits-secrets
              key: HABITS_RO_PASSWORD
        - name: MBAPP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: habits-secrets
              key: MBAPP_PASSWORD
        command: ['bash', '-c']
        args:
        - |
          set -euo pipefail
          export PGPASSWORD="$POSTGRES_PASSWORD"

          ensure_role() {
            local role="$1" pw="$2"
            psql -v ON_ERROR_STOP=1 -d postgres -v role="$role" <<'SQL'
              SELECT format('CREATE ROLE %I LOGIN', :'role')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'role')\gexec
          SQL
            psql -v ON_ERROR_STOP=1 -d postgres -c \
              "ALTER ROLE \"$role\" WITH LOGIN PASSWORD '$pw'"
          }

          ensure_role habits_owner "$HABITS_OWNER_PASSWORD"
          ensure_role habits_rw    "$HABITS_RW_PASSWORD"
          ensure_role habits_ro    "$HABITS_RO_PASSWORD"
          ensure_role mbapp_user   "$MBAPP_PASSWORD"

          psql -v ON_ERROR_STOP=1 -d postgres <<'SQL'
            SELECT 'CREATE DATABASE habits OWNER habits_owner'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='habits')\gexec
            SELECT 'CREATE DATABASE mbapp OWNER mbapp_user'
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname='mbapp')\gexec
          SQL

          psql -v ON_ERROR_STOP=1 -d habits <<'SQL'
            GRANT CONNECT ON DATABASE habits TO habits_rw, habits_ro;
            GRANT USAGE ON SCHEMA public TO habits_rw, habits_ro;
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO habits_rw;
            GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO habits_rw;
            GRANT SELECT ON ALL TABLES IN SCHEMA public TO habits_ro;
            ALTER DEFAULT PRIVILEGES FOR ROLE habits_owner IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO habits_rw;
            ALTER DEFAULT PRIVILEGES FOR ROLE habits_owner IN SCHEMA public
              GRANT USAGE, SELECT ON SEQUENCES TO habits_rw;
            ALTER DEFAULT PRIVILEGES FOR ROLE habits_owner IN SCHEMA public
              GRANT SELECT ON TABLES TO habits_ro;

            CREATE SCHEMA IF NOT EXISTS lira AUTHORIZATION habits_owner;
            ALTER ROLE habits_owner SET search_path TO lira, public;
            GRANT USAGE ON SCHEMA lira TO habits_rw, habits_ro;
            ALTER DEFAULT PRIVILEGES FOR ROLE habits_owner IN SCHEMA lira
              GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO habits_rw;
            ALTER DEFAULT PRIVILEGES FOR ROLE habits_owner IN SCHEMA lira
              GRANT USAGE, SELECT ON SEQUENCES TO habits_rw;
            ALTER DEFAULT PRIVILEGES FOR ROLE habits_owner IN SCHEMA lira
              GRANT SELECT ON TABLES TO habits_ro;
          SQL

          echo "Bootstrap complete."
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "500m"
